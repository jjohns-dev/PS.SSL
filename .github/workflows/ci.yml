name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

# Cancel any in-progress validate run on the same ref when a new one starts.
# This consolidates rapid-fire submissions (force-pushes, multiple commits in a
# PR) into a single completed run and saves Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@a3e5f5cea513381634f211ac3b9208cbe1245fff # C5 test
    with:
      os-matrix: '["ubuntu-latest", "windows-latest"]'
      min-tests: 336 # lower leg (ubuntu): 346 executed (360 tests - 14 disabled) - min(floor(346 * 0.05), 10) = 346 - 10
    permissions:
      contents: read
      checks: write
